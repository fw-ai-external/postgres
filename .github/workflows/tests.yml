name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  run-tests:
    strategy:
      matrix:
        go: ['1.19']
        gorm: ['v1.25.2', 'v1.31.1']
        platform: [ubuntu-latest]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go }}

    - name: Check out code into the Go module directory
      uses: actions/checkout@v3

    - name: Select GORM version
      run: go get gorm.io/gorm@${{ matrix.gorm }}

      # Run build of the application
    - name: Run build
      run: go build .

    - name: Run tests
      env:
        GORM_POSTGRES_DSN: host=localhost user=postgres dbname=postgres sslmode=disable
      run: go test -race -count=1 -v ./...
